services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.deepseek.com}
      LLM_MODEL: ${LLM_MODEL:-deepseek-chat}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      CHROMA_DIR: /app/data/chroma
      CACHE_PATH: /app/data/cache.db
      PROFILE_PATH: /app/data/profile.json
      STATS_DB_PATH: /app/data/stats.sqlite
      STATS_AS_OF: ${STATS_AS_OF:-2026-11-01}
      DOCS_PATH: /app/data/docs/documents.jsonl
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-BAAI/bge-small-zh-v1.5}
      RERANK_ENABLED: ${RERANK_ENABLED:-false}
      RATE_LIMIT: ${RATE_LIMIT:-20/hour}
    volumes:
      - ./data:/app/data

  ui:
    build: .
    command: streamlit run app/ui/streamlit_app.py --server.address 0.0.0.0 --server.port 8501
    ports:
      - "8501:8501"
    environment:
      API_URL: http://api:8000
    depends_on:
      - api
    volumes:
      - ./data:/app/data