[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nba-agentic-rag"
version = "0.1.0"
description = "NBA Agentic RAG assistant with FastAPI and Streamlit"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "streamlit>=1.37",
    "langgraph>=0.2",
    "openai>=1.40",
    "chromadb>=0.5",
    "tavily-python>=0.5",
    "slowapi>=0.1.9",
]

[project.optional-dependencies]
embeddings = ["sentence-transformers>=3.0"]
eval = ["ragas>=0.2"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "integration: requires network or API keys",
]